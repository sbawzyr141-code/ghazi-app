name: Ghazi CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-check:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Seed backend data
        working-directory: backend
        run: npm run seed

      - name: Syntax check backend server
        working-directory: backend
        run: node --check server.js

  dashboard-web-build:
    name: Dashboard web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: flutter pub get

      - name: Analyze dashboard
        working-directory: dashboard
        run: flutter analyze

      - name: Build dashboard web app
        working-directory: dashboard
        run: flutter build web --release --base-href "/ghazi-app/" --dart-define=GHAZI_API_BASE_URL=https://ghazi-backend.onrender.com

  mobile-web-build:
    name: Mobile web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8

      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: mobile
        run: flutter analyze

      - name: Build mobile web app
        working-directory: mobile
        run: flutter build web --release --base-href "/ghazi-app/" --dart-define=GHAZI_API_BASE_URL=https://ghazi-backend.onrender.com
